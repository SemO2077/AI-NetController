name: Release Build & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and publish (e.g. v0.60.0)"
        required: true
        default: "v0.60.0"

permissions:
  contents: write

jobs:
  build-windows-agent:
    name: Build Windows Host Agent
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Run agent unit and security tests
        run: python -m unittest discover -s agent/tests -v

      - name: Build Windows Host Agent bundle
        working-directory: agent
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          if (-not $tag -or $tag -eq "main") { $tag = "v0.60.0" }
          python -m PyInstaller --noconfirm build_agent.spec
          if (Test-Path "dist/AI_NetController_HostAgent") {
            if ($env:AI_CODESIGN_THUMBPRINT) {
              powershell -ExecutionPolicy Bypass -File sign_binary.ps1 -TargetPath "dist/AI_NetController_HostAgent"
            } else {
              powershell -ExecutionPolicy Bypass -File sign_binary.ps1 -TargetPath "dist/AI_NetController_HostAgent" -AllowSelfSigned -SkipTimestamp
            }
            Compress-Archive -Path "dist/AI_NetController_HostAgent" -DestinationPath "../AI_NetController_HostAgent_${tag}_win64_portable.zip" -Force
          }
          if (Test-Path "dist/AI_NetController_HostAgent_standalone.exe") {
            if ($env:AI_CODESIGN_THUMBPRINT) {
              powershell -ExecutionPolicy Bypass -File sign_binary.ps1 -TargetPath "dist/AI_NetController_HostAgent_standalone.exe"
            } else {
              powershell -ExecutionPolicy Bypass -File sign_binary.ps1 -TargetPath "dist/AI_NetController_HostAgent_standalone.exe" -AllowSelfSigned -SkipTimestamp
            }
            Copy-Item "dist/AI_NetController_HostAgent_standalone.exe" "../AI_NetController_HostAgent_${tag}_win64.exe" -Force
          }

      - name: Upload Windows Agent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent-release
          path: |
            AI_NetController_HostAgent_*_win64_portable.zip
            AI_NetController_HostAgent_*_win64.exe
          if-no-files-found: error

  build-android-apk:
    name: Build Android Companion APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12 (for live daemon E2E test)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages, analyze, and test
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test test/

      - name: Build release Android APKs
        working-directory: apps/mobile
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then TAG="v0.60.0"; fi
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../../AI_NetController_${TAG}_arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../../AI_NetController_${TAG}.apk"

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: |
            AI_NetController_*_arm64-v8a.apk
            AI_NetController_*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub & GitLab Releases
    needs: [build-windows-agent, build-android-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve target release tag
        id: meta
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then TAG="v0.60.0"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download built artifacts into release directory
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-downloads

      - name: Stage release directory, checksums, and manifest
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          REL_DIR="public/releases/${TAG}"
          mkdir -p "$REL_DIR"
          find /tmp/release-downloads -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.apk" \) -exec cp -f {} "$REL_DIR/" \;
          python3 scripts/update_release_manifest.py --tag "$TAG"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish_github_release.py --tag "${{ steps.meta.outputs.tag }}"

      - name: Mirror release to GitLab (when GITLAB_TOKEN is configured)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -n "$GITLAB_TOKEN" ]; then
            python3 scripts/publish_gitlab_release.py --tag "${{ steps.meta.outputs.tag }}"
          else
            echo "GITLAB_TOKEN secret not configured; skipping GitLab release mirror from GitHub Actions."
          fi
