name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web-tests:
    name: Web Console & Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: npm run lint

      - name: Run web verification and stress benchmarks
        run: npm test

      - name: Build production web bundle
        run: npm run build

      - name: Upload web distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  agent-tests:
    name: Host Agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Syntax-check repository Python scripts
        run: python -c "import glob, py_compile; [py_compile.compile(p, doraise=True) for p in sorted(glob.glob('scripts/*.py'))]"

      - name: Run unit and security tests
        run: python -m unittest discover -s agent/tests -v

  mobile-tests:
    name: Mobile Companion (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python 3.12 (for live daemon E2E test)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Setup Java 17 (LTS for Android Gradle Plugin 9.3.1 & Gradle 9.5.0)
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        working-directory: apps/mobile
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter pub get

      - name: Run Flutter static analysis
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit and daemon integration tests
        working-directory: apps/mobile
        run: flutter test test/
