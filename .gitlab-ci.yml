workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - test
  - build
  - release

variables:
  GIT_DEPTH: "1"

default:
  interruptible: true

web:test:
  stage: test
  image: node:22-bookworm
  timeout: 10m
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  before_script:
    - npm ci || npm install --no-audit --no-fund
  script:
    - npm run lint
    - npm test
    - npm run build
  artifacts:
    name: "web-dist-$CI_COMMIT_REF_SLUG"
    expire_in: 7 days
    paths:
      - apps/web/dist/

agent:test:
  stage: test
  image: python:3.12-slim
  timeout: 10m
  variables:
    PYTHONFAULTHANDLER: "1"
  cache:
    key: pip-agent-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0
    - pip install --cache-dir .cache/pip -r agent/requirements.txt
  script:
    - python -m unittest discover -s agent/tests -v

mobile:test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  timeout: 15m
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv python3-pip
    - python3 -m venv /tmp/agent-venv
    - /tmp/agent-venv/bin/pip install --no-cache-dir -r agent/requirements.txt
    - export PATH="/tmp/agent-venv/bin:$PATH"
  script:
    - export PATH="/tmp/agent-venv/bin:$PATH"
    - cd apps/mobile
    - flutter pub get
    - flutter analyze --no-fatal-infos
    - flutter test test/

android:build:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  timeout: 20m
  needs:
    - mobile:test
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - cd apps/mobile
    - flutter pub get
    - flutter build apk --release --split-per-abi
  artifacts:
    name: "android-apk-$CI_COMMIT_REF_SLUG"
    expire_in: 30 days
    paths:
      - apps/mobile/build/app/outputs/flutter-apk/*.apk

package:upload:
  stage: release
  image: python:3.12-slim
  timeout: 10m
  needs:
    - web:test
    - agent:test
    - android:build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - mkdir -p "public/releases/$CI_COMMIT_TAG"
    - |
      if [ -f "apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
        cp -f "apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "public/releases/$CI_COMMIT_TAG/AI_NetController_${CI_COMMIT_TAG}_arm64-v8a.apk"
        cp -f "apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "public/releases/$CI_COMMIT_TAG/AI_NetController_${CI_COMMIT_TAG}.apk"
      fi
    - python3 scripts/update_release_manifest.py --tag "$CI_COMMIT_TAG"
    - python3 scripts/publish_gitlab_release.py --tag "$CI_COMMIT_TAG" --packages-only

release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - package:upload
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - echo "Publishing GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "AI NetController $CI_COMMIT_TAG"
    description: "./PATCH_NOTES.md"
    assets:
      links:
        - name: "Windows Host Agent (Standalone .EXE)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ainetcontroller/$CI_COMMIT_TAG/AI_NetController_HostAgent_${CI_COMMIT_TAG}_win64.exe"
          link_type: package
        - name: "Windows Host Agent (Portable .ZIP)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ainetcontroller/$CI_COMMIT_TAG/AI_NetController_HostAgent_${CI_COMMIT_TAG}_win64_portable.zip"
          link_type: package
        - name: "Android Universal Companion (.APK)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ainetcontroller/$CI_COMMIT_TAG/AI_NetController_${CI_COMMIT_TAG}.apk"
          link_type: package
        - name: "Android arm64-v8a Companion (.APK)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ainetcontroller/$CI_COMMIT_TAG/AI_NetController_${CI_COMMIT_TAG}_arm64-v8a.apk"
          link_type: package
        - name: "SHA-256 Checksums"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ainetcontroller/$CI_COMMIT_TAG/SHA256SUMS.txt"
          link_type: other
        - name: "Release Manifest (JSON)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ainetcontroller/$CI_COMMIT_TAG/RELEASE_MANIFEST.json"
          link_type: other
