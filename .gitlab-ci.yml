# AI NetController — GitLab CI/CD Pipeline
# Supports automated testing, linting, packaging, and GitLab Releases

stages:
  - test
  - build
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

default:
  interruptible: true

# -------------------------------------------------------------
# 1. Test Stage: Web Suite & Type Checking
# -------------------------------------------------------------
web:test:
  stage: test
  image: node:22-bullseye
  cache:
    key: ${CI_COMMIT_REF_SLUG}-web
    paths:
      - node_modules/
      - apps/web/node_modules/
      - apps/mobile/node_modules/
  before_script:
    - npm ci || npm install --no-audit --no-fund
  script:
    - npm run lint
    - npm test
    - npm run build
  artifacts:
    name: "web-dist-${CI_COMMIT_REF_SLUG}"
    expire_in: 7 days
    paths:
      - apps/web/dist/

# -------------------------------------------------------------
# 2. Test Stage: Python Agent Edge Cases & Security
# -------------------------------------------------------------
agent:test:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0
    - python -m pip install --upgrade pip
    - pip install -r agent/requirements.txt
  script:
    - python -m unittest discover -s agent/tests

# -------------------------------------------------------------
# 3. Build Stage: Native Android APK
# -------------------------------------------------------------
android:build:
  stage: build
  image: ghcr.io/cirruslabs/flutter:latest
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk python3 python3-pip
    - npm ci || npm install --no-audit --no-fund
  script:
    - python3 scripts/build_android_app.py
  artifacts:
    name: "android-apk-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - public/releases/

# -------------------------------------------------------------
# 4. Release Stage: Publish GitLab Release on Tag
# -------------------------------------------------------------
release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Publishing AI NetController release for tag ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'AI NetController $CI_COMMIT_TAG'
    description: './PATCH_NOTES.md'
    assets:
      links:
        - name: 'Standalone Windows Host Agent (.EXE)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/public/releases/${CI_COMMIT_TAG}/AI_NetController_HostAgent_${CI_COMMIT_TAG}_win64.exe?job=android:build'
        - name: 'Android Companion Client (.APK)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/public/releases/${CI_COMMIT_TAG}/AI_NetController_${CI_COMMIT_TAG}_arm64-v8a.apk?job=android:build'
        - name: 'Windows Portable Bundle (.ZIP)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/public/releases/${CI_COMMIT_TAG}/AI_NetController_HostAgent_${CI_COMMIT_TAG}_win64_portable.zip?job=android:build'
