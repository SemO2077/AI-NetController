plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.cst.autonomouslan"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "com.cst.autonomouslan"
        minSdk 24
        targetSdk 36
        versionCode 600
        versionName "0.60.00-beta"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("AI_ANDROID_KEYSTORE")
            def ksPass = System.getenv("AI_ANDROID_KEYSTORE_PASS")
            def ksAlias = System.getenv("AI_ANDROID_KEY_ALIAS")
            def ksKeyPass = System.getenv("AI_ANDROID_KEY_PASS") ?: ksPass
            if (ksPath && ksPass && ksAlias) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            def strictRelease = System.getenv("AI_RELEASE_BUILD") == "1"
            def hasReleaseKeystore = (System.getenv("AI_ANDROID_KEYSTORE") ?: "").trim().length() > 0 &&
                (System.getenv("AI_ANDROID_KEYSTORE_PASS") ?: "").trim().length() > 0 &&
                (System.getenv("AI_ANDROID_KEY_ALIAS") ?: "").trim().length() > 0
            if (strictRelease && !hasReleaseKeystore) {
                throw new GradleException("AI_RELEASE_BUILD=1 requires AI_ANDROID_KEYSTORE, AI_ANDROID_KEYSTORE_PASS, and AI_ANDROID_KEY_ALIAS")
            }
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity-ktx:1.10.1"
}
