plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.cst.autonomouslan"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.cst.autonomouslan"
        minSdk 24
        targetSdk 36
        versionCode 900
        versionName "0.90.00-beta"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def ksPath = (System.getenv("AI_ANDROID_KEYSTORE") ?: "").trim()
            def ksPass = (System.getenv("AI_ANDROID_KEYSTORE_PASS") ?: "").trim()
            def ksAlias = (System.getenv("AI_ANDROID_KEY_ALIAS") ?: "").trim()
            def ksKeyPass = (System.getenv("AI_ANDROID_KEY_PASS") ?: "").trim() ?: ksPass
            if (ksPath && ksPass && ksAlias) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            def strictRelease = System.getenv("AI_RELEASE_BUILD") == "1"
            def ksPath = (System.getenv("AI_ANDROID_KEYSTORE") ?: "").trim()
            def ksPass = (System.getenv("AI_ANDROID_KEYSTORE_PASS") ?: "").trim()
            def ksAlias = (System.getenv("AI_ANDROID_KEY_ALIAS") ?: "").trim()
            def hasReleaseKeystore = ksPath.length() > 0 &&
                ksPass.length() > 0 &&
                ksAlias.length() > 0
            if (strictRelease) {
                if (!hasReleaseKeystore) {
                    throw new GradleException("AI_RELEASE_BUILD=1 requires AI_ANDROID_KEYSTORE, AI_ANDROID_KEYSTORE_PASS, and AI_ANDROID_KEY_ALIAS")
                }
                if (!file(ksPath).exists()) {
                    throw new GradleException("AI_ANDROID_KEYSTORE file does not exist: ${ksPath}")
                }
            }
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity-ktx:1.10.1"
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source "../.."
}
